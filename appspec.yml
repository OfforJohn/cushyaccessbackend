version: 0.0
os: linux

files:
  - source: /
    destination: /home/ubuntu/cushyaccess-backend

permissions:
  - object: /home/ubuntu/cushyaccess-backend
    owner: ubuntu
    group: ubuntu
    mode: 755
    type:
      - directory
      - file

hooks:
  BeforeInstall:
    - location: scripts/before_install.sh
      timeout: 300
      runas: root

  AfterInstall:
    - location: scripts/after_install.sh
      timeout: 300
      runas: ubuntu

  ApplicationStart:
    - location: scripts/start_application.sh
      timeout: 600
      runas: ubuntu
